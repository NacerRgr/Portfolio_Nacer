<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 860" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="860" fill="#ffffff" />

  <text x="650" y="55" text-anchor="middle" font-size="38" font-weight="600" fill="#111827">Cloud Architecture: Black Friday Survival</text>
  <text x="650" y="85" text-anchor="middle" font-size="17" fill="#555555">AWS EKS running Google's Online Boutique, scaled to survive 90,000 concurrent users</text>

  <!-- VPC boundary -->
  <rect x="240" y="130" width="760" height="560" rx="24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,6" />
  <text x="262" y="162" font-size="17" font-weight="700" fill="#475569">☁️ AWS Cloud: Multi-AZ VPC</text>

  <!-- ALB -->
  <rect x="420" y="180" width="380" height="60" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
  <text x="610" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Application Load Balancer</text>

  <!-- EKS cluster -->
  <rect x="270" y="270" width="700" height="300" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2" />
  <text x="292" y="300" font-size="19" font-weight="700" fill="#9a3412">☸️ AWS EKS Cluster: Online Boutique Microservices</text>

  <!-- microservice chips -->
  <g font-size="13" fill="#7c2d12">
    <rect x="290" y="320" width="190" height="36" rx="8" fill="#ffedd5" stroke="#fb923c" />
    <text x="385" y="343" text-anchor="middle">frontend</text>
    <rect x="510" y="320" width="190" height="36" rx="8" fill="#ffedd5" stroke="#fb923c" />
    <text x="605" y="343" text-anchor="middle">cartservice</text>
    <rect x="730" y="320" width="190" height="36" rx="8" fill="#ffedd5" stroke="#fb923c" />
    <text x="825" y="343" text-anchor="middle">checkoutservice</text>

    <rect x="290" y="368" width="190" height="36" rx="8" fill="#ffedd5" stroke="#fb923c" />
    <text x="385" y="391" text-anchor="middle">productcatalogservice</text>
    <rect x="510" y="368" width="190" height="36" rx="8" fill="#ffedd5" stroke="#fb923c" />
    <text x="605" y="391" text-anchor="middle">recommendationservice</text>
    <rect x="730" y="368" width="190" height="36" rx="8" fill="#ffedd5" stroke="#fb923c" />
    <text x="825" y="391" text-anchor="middle">currencyservice</text>

    <rect x="290" y="416" width="190" height="36" rx="8" fill="#ffedd5" stroke="#fb923c" />
    <text x="385" y="439" text-anchor="middle">paymentservice</text>
    <rect x="510" y="416" width="190" height="36" rx="8" fill="#ffedd5" stroke="#fb923c" />
    <text x="605" y="439" text-anchor="middle">shippingservice</text>
    <rect x="730" y="416" width="190" height="36" rx="8" fill="#ffedd5" stroke="#fb923c" />
    <text x="825" y="439" text-anchor="middle">emailservice</text>

    <rect x="290" y="464" width="190" height="36" rx="8" fill="#ffedd5" stroke="#fb923c" />
    <text x="385" y="487" text-anchor="middle">adservice</text>
    <rect x="510" y="464" width="190" height="36" rx="8" fill="#ffedd5" stroke="#fb923c" />
    <text x="605" y="487" text-anchor="middle">redis-cart</text>
  </g>

  <!-- Node groups -->
  <rect x="310" y="590" width="320" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2" />
  <text x="470" y="618" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">On-Demand Node Group (base capacity)</text>
  <rect x="650" y="590" width="320" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2" />
  <text x="810" y="618" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Spot Node Group (cost optimization)</text>

  <!-- ALB -> EKS -->
  <line x1="610" y1="240" x2="610" y2="268" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />
  <text x="622" y="260" font-size="12" fill="#374151">routes traffic</text>

  <!-- Load Testing -->
  <circle cx="130" cy="210" r="65" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <text x="130" y="225" text-anchor="middle" font-size="46">🧪</text>
  <text x="130" y="298" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Load Testing</text>
  <text x="130" y="315" text-anchor="middle" font-size="12" fill="#78350f">(k6 / Locust)</text>
  <text x="130" y="330" text-anchor="middle" font-size="12" fill="#78350f">1K → 90K users</text>

  <line x1="195" y1="210" x2="418" y2="210" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />
  <text x="307" y="192" text-anchor="middle" font-size="12" fill="#374151">Progressive ramp,</text>
  <text x="307" y="206" text-anchor="middle" font-size="12" fill="#374151">weekly milestones</text>

  <!-- Terraform -->
  <text x="130" y="558" text-anchor="middle" font-size="12" fill="#374151">Provisions VPC, subnets,</text>
  <text x="130" y="572" text-anchor="middle" font-size="12" fill="#374151">IAM roles &amp; EKS cluster</text>
  <circle cx="130" cy="650" r="65" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" />
  <text x="130" y="665" text-anchor="middle" font-size="46">🏗️</text>
  <text x="130" y="738" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Terraform</text>

  <line x1="195" y1="650" x2="238" y2="650" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- HPA -->
  <circle cx="1130" cy="330" r="58" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text x="1130" y="344" text-anchor="middle" font-size="42">📊</text>
  <text x="1130" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">HPA Autoscaling</text>

  <line x1="1072" y1="330" x2="972" y2="330" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1022" y="304" text-anchor="middle" font-size="12" fill="#374151">scales pod replicas</text>
  <text x="1022" y="318" text-anchor="middle" font-size="12" fill="#374151">on CPU / RPS</text>

  <!-- Grafana -->
  <circle cx="1130" cy="490" r="58" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
  <text x="1130" y="504" text-anchor="middle" font-size="42">📈</text>
  <text x="1130" y="572" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Grafana + Prometheus</text>

  <line x1="972" y1="480" x2="1072" y2="486" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1020" y="463" text-anchor="middle" font-size="12" fill="#374151">scrapes metrics,</text>
  <text x="1020" y="477" text-anchor="middle" font-size="12" fill="#374151">live dashboards</text>

  <!-- Security -->
  <circle cx="1130" cy="650" r="58" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
  <text x="1130" y="664" text-anchor="middle" font-size="42">🛡️</text>
  <text x="1130" y="722" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">Security Scans +</text>
  <text x="1130" y="738" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">Network Policies</text>

  <line x1="1072" y1="640" x2="902" y2="580" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />
  <text x="982" y="585" text-anchor="start" font-size="12" fill="#374151">enforces policies,</text>
  <text x="982" y="599" text-anchor="start" font-size="12" fill="#374151">scans images</text>

  <!-- Chaos Engineering -->
  <circle cx="650" cy="760" r="55" fill="#fce7f3" stroke="#db2777" stroke-width="2" />
  <text x="650" y="774" text-anchor="middle" font-size="40">🌀</text>
  <text x="650" y="835" text-anchor="middle" font-size="14" font-weight="700" fill="#831843">Chaos Engineering Drills</text>

  <line x1="650" y1="572" x2="650" y2="703" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />
  <text x="650" y="665" text-anchor="middle" font-size="12" fill="#374151">fault injection</text>
  <text x="650" y="679" text-anchor="middle" font-size="12" fill="#374151">&amp; game days</text>

  <!-- Runbooks -->
  <rect x="850" y="755" width="270" height="70" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="2" />
  <text x="985" y="783" text-anchor="middle" font-size="14" font-weight="700" fill="#831843">Incident Runbooks</text>
  <text x="985" y="803" text-anchor="middle" font-size="13" fill="#831843">MTTR tracking</text>

  <line x1="705" y1="755" x2="848" y2="785" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />
</svg>
